name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build release package
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          .\Build-Package.ps1 -Version $version

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $archive = "release/BLRP-Tools-v$version-win-x64.zip"
          $notes = "release-notes/$env:GITHUB_REF_NAME.md"

          if (-not (Test-Path -LiteralPath $notes)) {
            throw "Missing required release changelog: $notes"
          }

          gh release view $env:GITHUB_REF_NAME *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release edit $env:GITHUB_REF_NAME --title "BLRP Tools $env:GITHUB_REF_NAME" --notes-file $notes
            if ($LASTEXITCODE -ne 0) { throw "Failed to update the GitHub release notes." }
            gh release upload $env:GITHUB_REF_NAME $archive --clobber
            if ($LASTEXITCODE -ne 0) { throw "Failed to upload the release archive." }
          }
          else {
            gh release create $env:GITHUB_REF_NAME $archive --title "BLRP Tools $env:GITHUB_REF_NAME" --notes-file $notes
            if ($LASTEXITCODE -ne 0) { throw "Failed to create the GitHub release." }
          }
